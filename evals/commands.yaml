- {id: t06, say: "What's in my sandbox folder?", expect: tool, tool: list_dir, args: {path: 'C:\JarvisSandbox'}}
- {id: t07, say: 'List the files in C:\JarvisSandbox\downloads', expect: tool, tool: list_dir, args: {path: 'C:\JarvisSandbox\downloads'}}
- {id: t08, say: 'Read C:\JarvisSandbox\notes\todo.txt', expect: tool, tool: read_text_file, args: {path: 'C:\JarvisSandbox\notes\todo.txt'}}
- {id: t09, say: 'Show me the contents of C:\JarvisSandbox\project\README.md', expect: tool, tool: read_text_file, args: {path: 'C:\JarvisSandbox\project\README.md'}}
- {id: t10, say: "What do you remember about my project deadlines?", expect: tool, tool: recall_memory}

