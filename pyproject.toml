[project]
name = "jarvis"
version = "0.1.0"
description = "Local-first, voice-first desktop assistant for Windows"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.136.3",
    "openjarvis",
    "uvicorn>=0.54.0",
]

[tool.uv.workspace]
members = [
    "OpenJarvis",
]

[tool.uv.sources]
openjarvis = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # keep pytest out of the OpenJarvis/ clone
